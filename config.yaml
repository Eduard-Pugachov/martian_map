# Martian Map config. All tunable numbers live here (CLAUDE.md conventions).
# Values marked ASSUMPTION are placeholders to tune or justify before the demo.

paths:
  raw: data/raw
  processed: data/processed
  checkpoints: checkpoints
  dtm_raw: data/raw/jezero/JEZ_hirise_soc_006_DTM_MOLAtopography_DeltaGeoid_1m_Eqc_latTs0_lon0_blend40.tif
  ortho_raw: data/raw/jezero/JEZ_hirise_soc_006_orthoMosaic_25cm_Eqc_latTs0_lon0_first.tif
  ctx_raw: data/raw/jezero/JEZ_ctx_B_soc_008_orthoMosaic_6m_Eqc_latTs0_lon0.tif
  domars_raw: data/raw/domars16k
  dtm_aoi: data/processed/dtm_aoi.tif
  ortho_1m: data/processed/ortho_1m.tif      # 25 cm ortho area-averaged onto the DTM grid
  ctx_aoi: data/processed/ctx_aoi.tif
  slope: data/processed/slope_deg.tif
  hazard_labels: data/processed/hazard_labels.tif
  previews: data/processed/previews
  route_grid: data/processed/route_grid.npz   # slope (block max) + DEM (block mean) at grid.route_cell_size_m
  tiles_index: data/processed/tiles.csv       # one row per tile: row, col (1 m px), split, class fractions

tiles:
  size_px: 512              # 512 m at 1 m/px
  block_m: 1000             # split blocks on a 1 km grid; block (0, 0) = north-west corner of the DTM
  buffer_m: 300             # a tile + this margin must touch only its own split's blocks
  min_valid_frac: 0.5       # drop tiles with less valid (label != 255 and ortho != 0) area
  # Block ranges [row_start, row_end, col_start, col_end), end exclusive. Everything else = train.
  test_blocks: [8, 14, 8, 14]   # 6x6 km, contains the whole demo route (delta front + crater floor)
  val_blocks: [0, 5, 11, 17]    # northern scarps; contiguous, far from test

route:
  # Demo endpoints in map metres (same Eqc CRS as the DTM).
  # Start: Octavia E. Butler landing site, 18.4447N 77.4508E -> x = R*lon, y = R*lat (R = 3,396,190 m)
  start_xy: [4590904, 1093296]
  goal_xy: [4585686, 1097658]   # ASSUMPTION: a point on the western delta near its main channel (~7 km from start)
  # Second pair (3.6 km, SW crater floor, train area) chosen so the slope-only route crosses a DoMars 'ael' dune
  # patch: shows the landform term changing a route. Picked by a random search over pairs (not tuned to the weights).
  landform_demo:
    start_xy: [4584114, 1090206]
    goal_xy: [4587558, 1091256]

hazard:
  # Gaussian pre-smooth + Horn 3x3 slope -> effective baseline ~3 m (DTM resolves ~3-5 m features)
  slope_sigma_px: 1.0
  # ASSUMPTION: safe < 10 deg <= caution < 25 deg <= hazard (walking EVA). 255 = ignore (near DTM nodata)
  thresholds_deg: [10.0, 25.0]

aoi:
  # ASSUMPTION: ~10x10 km around the Perseverance landing site / delta front.
  # Fill in projected (Eqc) bounds in metres once the DTM is downloaded.
  crs: null
  bounds: {left: null, bottom: null, right: null, top: null}

grid:
  dtm_pixel_size_m: 1.0
  route_cell_size_m: 5.0   # downsample for fast routing (PLAN §3C: 5-10 m)

ai4mars:
  classes: {0: soil, 1: bedrock, 2: sand, 3: big_rock}
  ignore_index: 255
  image_size: 512           # 256 if GPU time is tight
  # ASSUMPTION: big rock is rare (~3% of pixels), weight it up. Recompute from data.
  class_weights: [1.0, 1.0, 1.5, 4.0]
  hazard_weights: {sand: 1.0, big_rock: 1.5}   # ASSUMPTION: ground hazard score

domars:
  weights: data/raw/domars16k/models/resnet50.pth   # pretrained, 93.2% on the DoMars16k test split
  arch: resnet50
  patch_size: 200           # CTX px (6 m) = 1.2 km window
  stride: 50                # 300 m landform cells; each averages the windows overlapping it
  min_confidence: 0.6       # ASSUMPTION: below this max class prob a cell is UNKNOWN (multiplier 1.0);
                            # removes the low-confidence 'cliff' misfires on flat floor (mean conf 0.44)
  map: data/processed/landform.npz
  classes: [aec, ael, cli, rid, fsf, sfe, fsg, fse, fss, cra, sfx, mix, rou, smo, tex]

cost:
  # slope cost = 1 + (slope / slope_scale_deg) ** 2, impassable above max_slope_deg
  slope_scale_deg: 10.0
  max_slope_deg: 25.0       # ASSUMPTION: walking-EVA limit
  hazard_buffer_m: 5.0      # ASSUMPTION: keep-out margin around impassable cells (rounded to whole routing cells)
  # ASSUMPTION: every landform multiplier is a placeholder, not tuned (null = impassable).
  # Codes per the DoMars16k Zenodo record (doi 10.5281/zenodo.4291940); the codes do not match the names' initials.
  landform_multiplier:
    smo: 1.0   # smooth terrain
    tex: 1.3   # textured terrain
    mix: 1.5   # mixed terrain
    rou: 2.5   # rough terrain
    cra: 2.0   # crater
    sfx: 1.2   # crater field; lowered from 2.0: on Jezero it is mostly the flat, easy eastern floor
    aec: 4.0   # aeolian straight (dunes)
    ael: 4.0   # aeolian curved (dunes)
    cli: null  # cliff -> impassable
    fsf: 1.5   # channel
    sfe: 1.5   # mounds
    fsg: 3.0   # gullies
    fse: 2.0   # slope streaks
    fss: 1.2   # mass wasting; was 2.0 under a wrong "slope streaks" label. The 11% 'fss' on the flat
               # crater floor is likely a domain-shift artifact (mosaic unlike training CTX), not real mass wasting
  roughness_weight: 0.0     # stretch: roughness cost term, off by default

dtm_free:
  # DTM-free mode (PLAN §3E): route on U-Net hazard classes instead of DTM slope, compare to the DTM route
  ckpt: checkpoints/hazard_unet_best.pt
  pred_maps:                # 5 m cells: max class + max softmax per class, regions the model never trained on
    test: data/processed/pred_hazard.npz
    val: data/processed/pred_hazard_val.npz
  context_px: 256           # extra image read around the region so the model has context at its edge
  nodata_margin_px: 16      # ASSUMPTION: drop predictions this close to ortho no-data (model calls the edge a scarp)
  class_costs: [1.0, 3.0, 50.0]   # ASSUMPTION: safe, caution, hazard; hazard high but not impassable (PLAN §3D)
  # Risk-aware rule: a cell counts as hazard if its (5 m max-pooled) p_hazard >= this, else argmax class.
  # Chosen on val pairs only (compare_routes.py --sweep), then applied once to test. null = argmax only.
  hazard_prob_threshold: 0.1   # val sweep (100 pairs): crossings 48% vs 51-52% for 0.2, 0.3, argmax
  t_sweep: [0.1, 0.2, 0.3]
  max_median_extra_cost_pct: 25.0   # sweep constraint: median extra cost over passable val pairs
  n_val_pairs: 100          # up to this many fixed-seed val pairs (fewer if the val region can't fit them)
  overlap_radius_m: 5.0     # route cells within this distance of route T count as overlapping
  n_random_pairs: 200       # fixed-seed pairs inside the test region for the summary table (~6 min)
  pair_dist_m: [2000, 6000]
  seed: 0
  results: data/processed/eval/route_compare.json
  sweep_results: data/processed/eval/route_sweep_val.json

terrain:
  roughness_window_m: 5.0   # ASSUMPTION: window for detrended-elevation std

app:
  bundle: app/data/layers.npz   # test region (6x6 km) at 5 m: everything the app needs; committed for deployment
